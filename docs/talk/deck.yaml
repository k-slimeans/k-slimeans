    [1:00] This was our October result. The 1.7B was the best method, and the largest model, the 4B, was the worst: below k-means and below LSA in all five seeds, at 0.511 ACC.
    Its summaries show one obvious failure. A third of them talk about the cluster instead of standing in for it. The most common one is literally "What is the main topic of the following cluster of questions?" At the final step, 16 to 21 of the 150 clusters per seed share an identical summary.
    At this point that is only an association: the failure and the low score go together. Part 3 tests it.
    Transition: "Before we open up the replacement step, Samiksha and Nabin place this in the closest work."

