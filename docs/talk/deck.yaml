# ---------------------------------------------------------------------------------------------- Part 8 (Cooper, 1 min)

- id: "8.1"
  part: 8
  speaker: Cooper
  minutes: 1
  type: answer
  title: "The answer"
  left:
    heading: "When is a summary a useful centroid?"
    items:
      - "When it stands in for its members: it moves little and **protects** the cluster; it does not improve it."
      - "When it moves members, step 1 **helped mixed clusters and hurt pure ones**, and our quality scores couldn't tell which in advance."
      - "**Readable ≠ representative**: 36% to 44% of the fluent Qwen3 summaries fail coverage or specificity (LSA 14%). Two human raters back the coverage flag."
      - "Failed stand-ins hurt at step 1 (swap test). That they decide the final score is **not shown**; the prompt's wording mattered more than size."
  right:
    heading: "Is the extra cost justified?"
    items:
      - "CLINC150: LSA gains **+0.009 ACC** over k-means for **15 s** a seed. No SLM is shown above LSA, at **25 to 84 times** its summarizer time."
      - "In dollars: **$0.025 to $0.125** a seed on a rented GPU (LSA $0.001). The same prompts to a hosted large model: **$1.51 to $3.59** a seed."
      - "BANKING77 and BBC: no measured ACC gain over LSA (BBC dense +0.5 points, not read as a method difference)."
      - "On this evidence the **extractive summarizer is the better-value choice**."
  limits: "Limits: one model family · per-cluster analysis on one dataset · 5 seeds, uncorrected intervals · interventions at step 1 on one model pair · arXiv is a one-seed pilot"
  source: "synthesis.md §10, §12, §13 · cost_justification.md §3, §4 · bbc.md §2"
  notes: |
    [1:00] Our answer has two halves, both mostly from CLINC150 and Qwen3.
    A generated summary is a useful centroid when it actually stands in for its members: then it moves little and keeps the cluster. When it does move members, at step 1 that helped mixed clusters and hurt pure ones, and our quality scores didn't tell the two apart in advance. Failed stand-ins hurt at step 1, which the swap test shows; that they decide the final score, we couldn't show.
    On cost: no small model was shown to beat the extractive summarizer on accuracy, and LSA takes a small fraction of the time, and a tenth of a cent a seed. So on this evidence the extra cost of a small LM is not justified, and the extractive summarizer is the better-value choice.
    Thank you. We're happy to take questions.

