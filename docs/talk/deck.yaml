slides:

# ---------------------------------------------------------------------------------------------- Part 1 (Cooper, 4 min)

- id: "1.1"
  part: 1
  speaker: Cooper
  minutes: 0.5
  type: title
  title: "When is a generated summary a useful centroid?"
  subtitle: "Small-language-model summaries as k-means centroids (k-SLiMeans)"
  byline: "Cooper Wooley · Samiksha Aryal · Nabin Paudyal"
  occasion: "December 2, 2026"
  quote: "“When does a generated summary provide a useful centroid, and when is its additional computational cost justified?”"
  notes: |
    [0:30] Our project answers one question, the one our instructor asked us after the November report: when does a generated summary give a useful centroid, and when is its extra computational cost justified?
    Everything you'll see comes from runs we already had. After the November 18 feedback we added no new models or experiments.
    I'll set up the method and then take apart what a replacement does. Samiksha covers how good the summaries are, Nabin covers model size and cost, and I close with the answer.

- id: "1.2"
  part: 1
  speaker: Cooper
  minutes: 1
  type: flow
  title: "Each round, a summary of the cluster becomes its new center"
  steps:
    - {label: "Embed", detail: "every text → a vector, once, shared by all methods"}
    - {label: "Step 0", detail: "k-means++ start, one Lloyd block"}
    - {label: "Summarize", detail: "each cluster's members → one text", loop: true}
    - {label: "Replace", detail: "the summary's embedding becomes the cluster's center", loop: true, accent: true}
    - {label: "Lloyd block", detail: "20 iterations: assign, re-average", loop: true}
    - {label: "Score", detail: "ACC, NMI, ARI against the gold labels"}
  loop_label: "× 5 summary steps"
  variants:
    - {name: "k-NLPmeans (upstream)", detail: "LSA picks 5 member sentences: extractive"}
    - {name: "k-SLMmeans (ours)", detail: "Qwen3 0.6B / 1.7B / 4B writes one new question"}
  callout: "On a given seed every method starts from the same step-0 partition, so at step 1 the summarizer is the only difference."
  source: "README “How the algorithm maps to the code”, “Reproduction status” · clinc150_summarizers.md §1 · replacement_diagnostic.md §1"
  notes: |
    [1:00] This is the upstream k-NLPmeans loop (arXiv 2502.09667), which we re-implemented. Ours gives the same assignments as the upstream code in every check we ran.
    Embed the texts, run k-means once. Then, five times: summarize each cluster, embed the summary, and let that embedding replace the cluster's center. Then run a Lloyd block of 20 iterations.
    The summarizer is the only thing we change. The upstream method uses LSA, an extractive summarizer that picks five member sentences. Ours asks a small Qwen3 model to write one new question.
    One design point matters for everything later. For a given seed, every method starts from the same step-0 partition. So at summary step 1, cluster c has the same members whichever model summarized it, and every comparison is paired by seed.

- id: "1.3"
  part: 1
  speaker: Cooper
  minutes: 1
  type: two_column
  title: "One main dataset, three sizes of one model family, five paired seeds"
  left:
    heading: "Data"
    items:
      - "**CLINC150**: 22,500 queries, 150 intents, k = 150. The main dataset, and the only one replayed cluster by cluster"
      - "**BANKING77**: 3,080 queries, 77 intents"
      - "**BBC News**: 500 articles, 5 topics (TF-IDF and a dense encoder)"
      - "**arXiv**: a 200k-abstract pilot, 1 seed"
  right:
    heading: "Protocol"
    items:
      - "**Qwen3 0.6B / 1.7B / 4B**: greedy, thinking off, ≤ 64 new tokens; batch 8 / 4 / 1"
      - "**Two prompts on CLINC150**: the October prompt and a clearer one, fixed before any run"
      - "**5 seeds**, all methods paired on the same step-0 partition"
      - "**Paired differences**, 95% t-interval (4 df), not corrected for multiple comparisons"
      - "One RTX 3060, 12 GB"
  source: "clinc150_summarizers.md §1, §2.2 · prompt_test.md §1 · bbc.md §1 · arxiv_status.md §5.1 · cost_justification.md §1"
  notes: |
    [1:00] CLINC150 carries the mechanism results, because it is the dataset we can replay cluster by cluster. The other datasets are method-level only.
    The summarizers are three sizes of one family, Qwen3, run locally with greedy decoding. The batch sizes differ because the 4B only fits on our 12 GB card at batch 1; Nabin comes back to that.
    Five seeds give wide intervals. An interval that only just excludes zero is weak evidence, and "not detectable" means not detectable with five seeds, not "no effect".

- id: "1.4"
  part: 1
  speaker: Cooper
  minutes: 1
  type: bar_chart
  title: "Where we started: the largest model did worst"
  chart:
    caption: "CLINC150 · final ACC · October prompt · mean of 5 seeds · axis starts at 0.48"
    categories: ["k-means", "LSA", "0.6B", "1.7B", "old 4B"]
    values: [0.551, 0.560, 0.541, 0.570, 0.511]
    labels: ["0.551", "0.560", "0.541", "0.570", "0.511"]
