    - {stat: "5 / 5", text: "seeds where the 4B is below k-means and below LSA"}
    - {stat: "34%", text: "of the 4B's summaries, over all steps, talk about “the cluster” (0.6B and 1.7B: 8%)"}
    - {quote: "“What is the main topic of the following cluster of questions?”", text: "the 4B's most common summary"}
  source: "CLINC150 · final · October prompt · 5 seeds · measurement; the link to the summaries is an association · clinc150_summarizers.md §2.1, §2.2, §2.4"
